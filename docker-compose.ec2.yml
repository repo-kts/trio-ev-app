# EC2 production stack — server + db only.
# Frontends are served from S3 + CloudFront, not from here.
#
# This file is copied to the EC2 box by the deploy workflow and run there:
#   IMAGE_TAG=<sha> docker compose -f docker-compose.ec2.yml pull
#   IMAGE_TAG=<sha> docker compose -f docker-compose.ec2.yml run --rm server bunx prisma migrate deploy
#   IMAGE_TAG=<sha> docker compose -f docker-compose.ec2.yml up -d
#
# Secrets (DATABASE_URL, JWT_SECRET, S3_*, CORS_ORIGIN, POSTGRES_PASSWORD, IMAGE_TAG)
# come from a `.env` file that lives on the EC2 box next to this file — never committed.

services:
    server:
        image: ghcr.io/${GHCR_OWNER:-repo-kts}/trio-server:${IMAGE_TAG:-latest}
        working_dir: /app/server
        command: ['bun', 'src/index.ts']
        env_file:
            - .env
        environment:
            NODE_ENV: production
            PORT: 8001
        ports:
            - '8001:8001'
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8001/health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
        restart: unless-stopped

    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            POSTGRES_DB: ${POSTGRES_DB:-trio}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trio}']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    pgdata:
