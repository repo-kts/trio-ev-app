name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

# One deploy at a time; let an in-flight deploy finish (don't cancel mid-rollout).
concurrency:
    group: deploy-production
    cancel-in-progress: false

env:
    BUN_VERSION: 1.3.1

jobs:
    # ──────────────────────────────────────────────────────────────
    # Frontends → S3 + CloudFront
    # ──────────────────────────────────────────────────────────────
    frontends:
        name: Deploy ${{ matrix.app }} → S3
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                app: [client, admin]
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install deps
              run: bun install --frozen-lockfile

            # VITE_API_URL is baked into the bundle at build time.
            - name: Build ${{ matrix.app }}
              env:
                  VITE_API_URL: ${{ secrets.VITE_API_URL }}
              run: bun --cwd ${{ matrix.app }} run build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Sync to S3
              env:
                  BUCKET: ${{ matrix.app == 'client' && secrets.S3_CLIENT_BUCKET || secrets.S3_ADMIN_BUCKET }}
              run: |
                  # Hashed assets: long cache. index.html + others: no-cache so new deploys are seen.
                  aws s3 sync ${{ matrix.app }}/dist "s3://$BUCKET" \
                      --delete \
                      --cache-control "public,max-age=31536000,immutable" \
                      --exclude "index.html" \
                      --exclude "*.map"
                  aws s3 cp ${{ matrix.app }}/dist/index.html "s3://$BUCKET/index.html" \
                      --cache-control "no-cache"

            - name: Invalidate CloudFront
              env:
                  DIST_ID: ${{ matrix.app == 'client' && secrets.CLOUDFRONT_CLIENT_ID || secrets.CLOUDFRONT_ADMIN_ID }}
              run: |
                  aws cloudfront create-invalidation \
                      --distribution-id "$DIST_ID" \
                      --paths "/*"

    # ──────────────────────────────────────────────────────────────
    # Server image → GHCR
    # ──────────────────────────────────────────────────────────────
    server-image:
        name: Build + push server image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.meta.outputs.image }}
        steps:
            - uses: actions/checkout@v4

            - name: Resolve image name (lowercase owner)
              id: meta
              run: |
                  owner="${GITHUB_REPOSITORY_OWNER,,}"
                  echo "image=ghcr.io/${owner}/trio-server" >> "$GITHUB_OUTPUT"
                  echo "owner=${owner}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build + push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: server/Dockerfile
                  target: prod
                  push: true
                  tags: |
                      ${{ steps.meta.outputs.image }}:${{ github.sha }}
                      ${{ steps.meta.outputs.image }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # ──────────────────────────────────────────────────────────────
    # Server deploy → EC2 (pull image, migrate, up)
    # ──────────────────────────────────────────────────────────────
    server-deploy:
        name: Deploy server → EC2
        runs-on: ubuntu-latest
        needs: server-image
        steps:
            - uses: actions/checkout@v4

            - name: Copy compose file to EC2
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  source: docker-compose.ec2.yml
                  target: ~/trio
                  overwrite: true

            - name: Pull, migrate, restart
              uses: appleboy/ssh-action@v1.2.0
              env:
                  IMAGE_TAG: ${{ github.sha }}
                  GHCR_OWNER: ${{ github.repository_owner }}
                  GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
                  GHCR_USER: ${{ github.actor }}
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  envs: IMAGE_TAG,GHCR_OWNER,GHCR_TOKEN,GHCR_USER
                  script: |
                      set -euo pipefail
                      cd ~/trio
                      # GHCR_OWNER must be lowercase for the image ref.
                      export GHCR_OWNER="$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
                      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
                      export IMAGE_TAG
                      docker compose -f docker-compose.ec2.yml pull
                      docker compose -f docker-compose.ec2.yml up -d db
                      docker compose -f docker-compose.ec2.yml run --rm server bunx prisma migrate deploy
                      docker compose -f docker-compose.ec2.yml up -d
                      docker image prune -f
